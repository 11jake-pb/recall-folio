<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Recall Folio</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var saved = localStorage.getItem("recall-theme");
      var theme = saved === "dark" || saved === "light"
        ? saved
        : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Recall Folio</p>
      <h1 id="sheet-title">학습 시트</h1>
    </div>
    <div class="actions">
      <p id="progress" aria-live="polite">맵</p>
      <button id="read-toggle" type="button" aria-pressed="false">줄글</button>
      <button id="cover-toggle" type="button" aria-expanded="true" hidden>핵심 가리기</button>
      <button id="qa-open" type="button" aria-expanded="false">QA</button>
      <button id="theme-toggle" type="button" aria-label="화면 모드 전환">라이트</button>
    </div>
  </header>

  <div class="stage">
    <div class="mind" id="mind" aria-label="조선 전기 마인드맵"></div>
    <main id="sheet" hidden></main>
  </div>
  <aside id="qa" hidden>
    <div class="qa-head">
      <strong>QA</strong>
      <button id="qa-close" type="button">닫기</button>
    </div>
    <ul id="qa-list"></ul>
  </aside>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
